name: TensorCar
options:
  bundleIdPrefix: com.gera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TensorCar:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TensorCar
        UILaunchScreen: {}
        # white status bar over the orange headers
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSLocalNetworkUsageDescription: Se conecta por WiFi al adaptador OBD para leer los datos del auto.
    settings:
      base:
        # kept from the Auto OBD days so installed copies keep their history
        PRODUCT_BUNDLE_IDENTIFIER: com.gera.autoobd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TensorCarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TensorCar
schemes:
  TensorCar:
    build:
      targets:
        TensorCar: all
    test:
      targets: [TensorCarTests]
